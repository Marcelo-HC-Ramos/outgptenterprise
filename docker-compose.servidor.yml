# OutGPT Enterprise em um servidor sempre ligado (VPS), com o túnel Cloudflare criado SEM cartão (modo "credenciais").
# Não use este arquivo à mão: o servidor/instalar.py gera o .env e a pasta cloudflared/ e sobe tudo (veja SERVIDOR.md).
# Se você criou o túnel no painel Zero Trust (com token), use o docker-compose.yml em vez deste.
services:
  outgpt:
    build: .
    restart: unless-stopped
    environment:
      OUTGPT_SETUP_TOKEN: ${OUTGPT_SETUP_TOKEN:-}
      OUTGPT_DOMINIO: ${OUTGPT_DOMINIO:-outgpt.ramosys.com.br}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OUTGPT_MODELO: ${OUTGPT_MODELO:-claude-opus-5-5}
    volumes:
      - dados:/data
    # sem publicação de portas: só o túnel conversa com o sistema, nada fica exposto na internet diretamente

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro     # config.yml + credenciais.json (gerados pelo instalador; fora do GitHub)
    depends_on:
      - outgpt

volumes:
  dados:
