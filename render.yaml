# Blueprint do Render (https://render.com): cria o serviço a partir do Dockerfile, com disco persistente.
# Confira os planos e preços atuais antes de criar. O servidor usa ~650 MB de memória com o modelo de busca carregado,
# então escolha um plano com pelo menos 1 GB de RAM (2 GB com folga). Disco persistente exige plano pago.
services:
  - type: web
    name: outgpt-enterprise
    runtime: docker
    plan: standard            # 2 GB de RAM; ajuste conforme o plano disponível na sua conta
    healthCheckPath: /saude
    disk:
      name: dados
      mountPath: /data
      sizeGB: 2
    envVars:
      - key: OUTGPT_SETUP_TOKEN       # senha de uma vez só para criar o master no primeiro acesso (o Render gera um valor)
        generateValue: true
      - key: ANTHROPIC_API_KEY        # opcional aqui: também dá para colar a chave na tela Administração > Inteligência artificial
        sync: false
